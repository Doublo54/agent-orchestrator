# ============================================================
# Discord Bot — Docker Compose
# ============================================================
# Runs OpenClaw as a simple Discord chat bot.
#
# Quick start:
#   cp .env.example .env        # fill in your tokens
#   docker compose up -d        # build + start
#   docker compose logs -f      # watch it boot
#
# Docs: https://docs.openclaw.ai/channels/discord
# ============================================================

services:
  openclaw:
    build:
      context: "https://github.com/openclaw/openclaw.git#main"
    container_name: openclaw-gateway
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18789}:18789"

    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      # Gateway
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_DISABLE_BONJOUR=1
      # LLM provider
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Discord
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      # PATH
      - PATH=/home/node/.local/bin:/home/node/.npm-global/bin:/usr/local/bin:/usr/bin:/bin

    volumes:
      - ./state/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./workspace:/home/node/.openclaw/workspace
      - openclaw_state:/home/node/.openclaw/state
      - openclaw_sessions:/home/node/.openclaw/sessions
      - openclaw_credentials:/home/node/.openclaw/credentials
      - openclaw_memory:/home/node/.openclaw/memory

    command:
      - sh
      - "-c"
      - |
        mkdir -p ~/.local/bin
        echo '#!/bin/sh' > ~/.local/bin/openclaw
        echo 'exec node /app/dist/index.js "$$@"' >> ~/.local/bin/openclaw
        chmod +x ~/.local/bin/openclaw

        openclaw doctor --fix 2>/dev/null || true

        sleep 1
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openclaw_state:
    name: openclaw_state
  openclaw_sessions:
    name: openclaw_sessions
  openclaw_credentials:
    name: openclaw_credentials
  openclaw_memory:
    name: openclaw_memory
